# Publica 0800webs.com en GitHub Pages.
#
# Corre con cada push a main y cada 15 minutos, para que un oficio recién
# publicado tenga su carpeta propia (/o/<slug>/) sin esperar a un push. Mientras
# tanto su web igual se ve, por 404.html. El generador está en .github/oficios.mjs.
name: Publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [oficios]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node .github/oficios.mjs _sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
