# Publica 0800webs.com en GitHub Pages.
#
# Corre con cada push a main (o a mano). El armado está en .github/armar.mjs:
# copia el repo sin lo interno y escribe sitemap.xml.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node .github/armar.mjs _sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
